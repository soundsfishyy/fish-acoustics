<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptobenthic Fish Sounds</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 0 22px;
            line-height: 1.6;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 40px;
        }

        .sound {
            margin-bottom: 35px;
        }

        .species {
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        audio {
            width: 100%;
        }

        .note {
            margin-top: 45px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>Cryptobenthic Fish Sounds</h1>

    <p class="subtitle">
        Representative feeding sounds presented at the conference poster.
    </p>

    <div class="sound">
        <div class="species">
            <strong>A.</strong> <em>Scartella cristata</em>
        </div>
<img
    src="Scartella_cristata.jpeg"
    alt="Scartella cristata"
    class="fish-photo"
>
        <audio controls preload="metadata">
            <source src="Scartella_cristata_feeding.wav" type="audio/wav">
            Your browser does not support audio playback.
        </audio>
    </div>

    <div class="sound">
        <div class="species">
            <strong>B.</strong> <em>Istiblennius meleagris</em>
        </div>
<img
    src="Istiblennius_meleagris.jpeg"
    alt="Istiblennius meleagris"
    class="fish-photo"
>
        <audio controls preload="metadata">
            <source src="Istiblennius_meleagris_feeding.wav" type="audio/wav">
            Your browser does not support audio playback.
        </audio>
    </div>

    <p class="note">
        Audio clips were high-pass filtered at 260 Hz to reduce low-frequency
        machine-borne noise and normalized for playback.
    </p>

</body>
</html>
